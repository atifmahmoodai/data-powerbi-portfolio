name: Power BI source validation
on:
  push:
    paths: ['power-bi/**', '.github/workflows/power-bi-validation.yml']
  pull_request:
    paths: ['power-bi/**', '.github/workflows/power-bi-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r power-bi/requirements-dev.txt
      - name: Fetch pinned Microsoft schemas
        run: |
          git clone https://github.com/microsoft/json-schemas.git /tmp/ms-schemas
          git -C /tmp/ms-schemas checkout 24ce2795f9fb15655f61185246b6578536ca43f8
      - name: Rebuild and validate
        run: |
          python power-bi/scripts/build.py
          python -m unittest discover -s power-bi/tests -v
          python power-bi/scripts/validate.py --schemas /tmp/ms-schemas
          git diff --exit-code -- power-bi
